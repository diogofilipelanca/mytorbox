services:
  addon:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 7000
      # No REDIS_URL here on purpose. `environment:` overrides `env_file:`, so setting it
      # would force a value regardless of what .env says. Running without Redis means the
      # library/TMDB/parse caches live in the process and are rebuilt after a restart.
    ports:
      # Bound to loopback ONLY — nginx on the host is the sole ingress.
      # The `127.0.0.1:` prefix is load-bearing, not cosmetic: without it Docker publishes
      # on 0.0.0.0 and punches through ufw via its own iptables rules, exposing the addon
      # directly. TRUST_PROXY_HOPS=1 assumes a proxy in front, so a directly reachable
      # port would let anyone forge X-Forwarded-For and walk past every rate limit.
      - "127.0.0.1:7000:7000"
