# /etc/nginx/sites-available/mytorbox
#
# Serves the addon on its own hostname, leaving the existing cryptotrader vhost untouched.
# Run certbot afterwards; it rewrites this block to add the TLS listener and the
# port-80 redirect:
#
#   certbot --nginx -d mytorbox.178-105-251-154.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name mytorbox.178-105-251-154.sslip.io;

    # Subtitle files are the largest thing served; JSON catalogs are the rest.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr, NOT $proxy_add_x_forwarded_for.
        # The latter appends to whatever the client sent, so a request arriving with a
        # forged X-Forwarded-For keeps those entries in the list. Overwriting with the
        # real peer address means the header has exactly one entry that nginx itself
        # wrote — which is precisely what TRUST_PROXY_HOPS=1 expects, and leaves the
        # rate limiter nothing to spoof.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Without this the addon builds subtitle URLs as http:// and Stremio refuses
        # them as mixed content.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # The admin surface has no business being reachable from the internet. It still
    # requires ADMIN_SECRET, but there's no reason to offer it publicly — reach it
    # through an SSH tunnel instead.
    location ~ ^/(stats|api/stats|api/cache/clear)$ {
        allow 127.0.0.1;
        deny all;
    }
}
